[permalinks]
  posts = "/:title/"

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
      # https://gohugo.io/content-management/markdown-attributes/
        image = true
        block = true
        title = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    ordered = true

