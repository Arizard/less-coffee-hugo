baseURL = "https://less.coffee/"
title = "Arie's Blog"
theme = "etch-less-coffee"
languageCode = "en-US"
enableInlineShortcodes = true
pygmentsCodeFences = true
pygmentsUseClasses = true
summaryLength = 0

[params]
  defaultAuthor = "Arie Oldman"
  description = "Writing for clarity." # shows up in meta tags
  greeting = "I have thoughts. They go here. Please enjoy." # shows up in secondary nav line
  # shows up in footer
  copyright = 'Made by Arie. Powered by _hugo_ and _gomments_.'
  highlight = true
  # github = "https://github.com/Arizard"
  # linkedin = "https://au.linkedin.com/in/arieoldman"
  # profilePicture = "arie-profile-2.jpeg"
  email = "arie@less.coffee"
  authorBio = "Hi, I'm Arie."
  authorBioImage = "/arie-bio.jpeg"

